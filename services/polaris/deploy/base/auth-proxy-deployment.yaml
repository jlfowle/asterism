apiVersion: apps/v1
kind: Deployment
metadata:
  name: asterism-auth-proxy
  labels:
    app.kubernetes.io/component: auth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: auth-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/component: auth-proxy
      annotations: {}
    spec:
      serviceAccountName: asterism-auth-proxy
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth-proxy
          image: quay.io/openshift/origin-oauth-proxy:4.21
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4180
              name: http
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - --http-address=0.0.0.0:4180
            - --https-address=
            - --upstream=http://asterism-internal.apps.os.fowler.house/
            - --openshift-service-account=asterism-auth-proxy
            - '--openshift-sar={"namespace":"$(POD_NAMESPACE)","resource":"services","resourceName":"asterism-auth-proxy","verb":"get"}'
            - --cookie-secret-file=/etc/oauth-proxy-cookie/cookie-secret
            - --request-logging
          volumeMounts:
            - name: oauth-proxy-cookie
              mountPath: /etc/oauth-proxy-cookie
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: oauth-proxy-cookie
          secret:
            secretName: asterism-auth-proxy-cookie
        - name: tmp
          emptyDir: {}
