apiVersion: apps/v1
kind: Deployment
metadata:
  name: asterism-opa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: opa
      app.kubernetes.io/name: asterism-opa
      app.kubernetes.io/part-of: asterism
  template:
    metadata:
      labels:
        app.kubernetes.io/component: opa
        app.kubernetes.io/name: asterism-opa
        app.kubernetes.io/part-of: asterism
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:1.15.2
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --config-file=/config/opa-config.yaml
            - /config/policy.rego
          ports:
            - containerPort: 8181
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: asterism-opa-config
        - name: tmp
          emptyDir: {}
